plugins {
    id 'org.springframework.boot' version '4.0.7' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.example'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.7'
        }
    }


    dependencies {
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter
        implementation("org.springframework.boot:spring-boot-starter:4.2.0-M1")
        implementation("org.slf4j:slf4j-api:2.0.19")
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
